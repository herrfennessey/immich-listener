name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.9"
          cache: true
      - run: go test -race ./...
      - run: go build ./cmd/sidecar
      - run: docker build -t immich-listener:ci .

  real-immich:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.9"
          cache: true
      - run: docker version
      - run: go test -tags=integration ./internal/immich -run TestRealImmichAssetUpsert -v
