name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.9"
          cache: true
      - run: go test -race ./...
      - run: go build ./cmd/sidecar
      - run: docker build -t immich-listener:ci .

  immich-e2e:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.9"
          cache: true
      - run: docker version
      - run: go test -tags=integration ./internal/immich -v

  compose-volume-init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: IMMICH_NETWORK=bridge IMMICH_EMAIL=listener@example.com IMMICH_PASSWORD=test docker compose run --rm --no-deps sidecar-init
