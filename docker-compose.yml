networks:
  # Immich runs as its own Compose project, so its containers use a separate
  # Docker network. The sidecar joins that network to reach immich-server by
  # name. Compose names a project's network "<project>_default" (for example
  # "immich_default"). Find yours with "docker network ls" and set
  # IMMICH_NETWORK. See the README "Connecting to Immich" section.
  immich:
    external: true
    name: ${IMMICH_NETWORK:-immich_default}

volumes:
  nats-data:
  # redis-data:
  # rabbitmq-data:
  # redpanda-data:
