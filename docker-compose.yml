services:
  nats:
    image: nats:2-alpine
    command: ["--jetstream", "--store_dir=/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    restart: unless-stopped

  sidecar:
    build: .
    environment:
      IMMICH_BASE_URL: ${IMMICH_BASE_URL:-http://immich-server:2283}
      IMMICH_API_KEY: ${IMMICH_API_KEY:?IMMICH_API_KEY is required}
      NATS_URL: nats://nats:4222
      NATS_STREAM_NAME: ${NATS_STREAM_NAME:-IMMICH}
      NATS_SUBJECT_PREFIX: ${NATS_SUBJECT_PREFIX:-immich}
      MEMBERSHIP_BUCKET: ${MEMBERSHIP_BUCKET:-immich_asset_albums}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-30s}
      SOCKETIO_ENABLED: ${SOCKETIO_ENABLED:-true}
    networks:
      - default # reach nats over this project's own network
      - immich  # reach immich-server over Immich's network (declared external below)
    depends_on:
      - nats
    restart: unless-stopped

networks:
  # Immich runs as its own, separate Compose project, so its containers live on a
  # different Docker network. Joining that network is what lets the sidecar
  # resolve `immich-server` by name. Compose names a project's default network
  # "<project>_default" (e.g. "immich_default"); find yours with `docker network
  # ls` and set IMMICH_NETWORK to match. See the README for the full walkthrough.
  immich:
    external: true
    name: ${IMMICH_NETWORK:-immich_default}

volumes:
  nats-data:
