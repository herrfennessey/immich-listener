services:
  # NATS JetStream is the default queue. The sidecar ships a NATS adapter.
  nats:
    image: nats:2-alpine
    command: ["--jetstream", "--store_dir=/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    restart: unless-stopped

  sidecar:
    build: .
    environment:
      IMMICH_BASE_URL: ${IMMICH_BASE_URL:-http://immich-server:2283}
      IMMICH_API_KEY: ${IMMICH_API_KEY:?IMMICH_API_KEY is required}
      IMMICH_EMAIL: ${IMMICH_EMAIL:?IMMICH_EMAIL is required}
      IMMICH_PASSWORD: ${IMMICH_PASSWORD:?IMMICH_PASSWORD is required}
      NATS_URL: nats://nats:4222
      NATS_STREAM_NAME: ${NATS_STREAM_NAME:-IMMICH}
      NATS_SUBJECT_PREFIX: ${NATS_SUBJECT_PREFIX:-immich}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-30s}
      SOCKETIO_ENABLED: ${SOCKETIO_ENABLED:-true}
    networks:
      - default # reach nats over this project's network
      - immich  # reach immich-server over Immich's network (external, below)
    depends_on:
      - nats
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Other self-hosted queues.
#
