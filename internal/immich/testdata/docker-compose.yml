# Minimal Immich release runtime derived from
# https://github.com/immich-app/immich/blob/v3.1.0/docker/docker-compose.yml.
# Keep these image references literal so Dependabot can update them.
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.1.0
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
    ports:
      - "2283"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - immich-upload:/data

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname=immich --username=postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - immich-postgres:/var/lib/postgresql/data

  redis:
    image: docker.io/valkey/valkey:9@sha256:3acc0687f2a2e1091fae6450d7842dd658c941338cf0a873ddd9e14b9e4ea4dd
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  nats:
    image: nats:2.11-alpine
    command: ["--jetstream", "--store_dir=/data"]
    ports:
      - "4222"

volumes:
  immich-upload:
  immich-postgres:
